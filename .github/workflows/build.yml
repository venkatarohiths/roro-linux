name: Build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deps
        run: sudo apt-get update && sudo apt-get install -y build-essential cpio rsync bc bison flex libssl-dev libelf-dev shellcheck
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            dl
            ccache
          key: buildroot-${{ runner.os }}-${{ hashFiles('configs/**','scripts/**') }}
      - name: Validate
        run: sh scripts/validate.sh
      - name: Build
        run: make build
      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: roro-linux-image
          path: out/x86_64-tiny/images/*
